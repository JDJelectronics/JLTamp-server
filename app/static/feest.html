<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e0e11">
<title>JLTamp Feest</title>
<!--
  De feestpagina. Wordt geserveerd door de JLTamp-server zelf (routers/feest.py)
  op /feest/<token>, voor gasten zonder app of account.

  Alles staat in dit ene bestand en er wordt niets van buiten geladen: geen CDN,
  geen lettertype, geen analytics. Wat een gast binnenkrijgt is titel, artiest en
  hoes; afspelen kan hier niet.

  Alle tekst die van de server komt gaat via textContent de pagina in, nooit via
  innerHTML — een bijnaam of titel is invoer van een vreemde.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0e11;
    --kaart: rgba(255,255,255,0.055);
    --rand: rgba(255,255,255,0.09);
    --tekst: #f2f2f4;
    --zacht: #a1a1aa;
    --flauw: #71717a;
    --accent: #00d4aa;
    --accent-zacht: rgba(0,212,170,0.14);
    --rood: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--tekst); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.4; min-height: 100vh;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(0,212,170,0.22), transparent 60%),
      radial-gradient(80% 50% at 100% 100%, rgba(120,80,255,0.12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header img { width: 36px; height: 36px; border-radius: 50%; }
  header .kop { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .wie { color: var(--zacht); font-size: 13px; }
  .kaart { background: var(--kaart); border: 1px solid var(--rand); border-radius: 18px; padding: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--zacht); margin: 26px 4px 10px; font-weight: 700; }
  .nu { display: flex; gap: 14px; align-items: center; }
  .nu .hoes { width: 84px; height: 84px; border-radius: 14px; }
  .nu .label { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
  .nu .titel { font-size: 19px; font-weight: 800; margin-top: 2px; }
  .hoes { flex: none; width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: linear-gradient(135deg, #24242b, #17171c); display: block; }
  .rij { display: flex; align-items: center; gap: 12px; padding: 9px 4px; }
  .rij + .rij { border-top: 1px solid rgba(255,255,255,0.05); }
  .tekst { flex: 1; min-width: 0; }
  .titel { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--zacht); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .door { color: var(--flauw); font-size: 12px; margin-top: 1px; }
  .volgende { display: inline-block; color: #0e0e11; background: var(--accent); font-size: 11px; font-weight: 800; border-radius: 6px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
  button { font: inherit; color: inherit; border: none; cursor: pointer; }
  .duim { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,0.06); border: 1px solid var(--rand); font-weight: 800; font-size: 13px; }
  .duim svg { width: 20px; height: 20px; }
  .duim.aan { background: var(--accent-zacht); border-color: var(--accent); color: var(--accent); }
  .plus { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #0e0e11; display: flex; align-items: center; justify-content: center; }
  .plus svg { width: 22px; height: 22px; }
  .plus:disabled { opacity: 0.5; }
  .zoek { position: sticky; top: 0; z-index: 5; padding: 10px 0; margin: 0 -2px; background: linear-gradient(var(--bg) 70%, transparent); }
  .zoek input { width: 100%; height: 50px; border-radius: 25px; border: 1px solid var(--rand); background: rgba(255,255,255,0.07); color: var(--tekst); padding: 0 20px; font-size: 16px; outline: none; }
  .zoek input:focus { border-color: var(--accent); }
  .leeg { color: var(--flauw); text-align: center; padding: 14px 6px; font-size: 14px; }
  .wensknop { width: 100%; margin-top: 10px; padding: 14px; border-radius: 14px; background: var(--accent-zacht); border: 1px dashed var(--accent); color: var(--accent); font-weight: 700; }
  .melding { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .25s ease; background: #1d1d23; border: 1px solid var(--rand); padding: 12px 18px; border-radius: 14px; max-width: calc(100% - 32px); text-align: center; z-index: 20; pointer-events: none; }
  .melding.zicht { opacity: 1; transform: translateX(-50%) translateY(0); }
  .laag { position: fixed; inset: 0; background: rgba(8,8,10,0.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 30; }
  .laag[hidden] { display: none; }
  .laag .kaart { width: 100%; max-width: 380px; padding: 22px; text-align: center; }
  .laag h3 { margin: 4px 0 6px; font-size: 22px; }
  .laag p { color: var(--zacht); margin: 0 0 16px; }
  .laag input { width: 100%; height: 50px; border-radius: 14px; border: 1px solid var(--rand); background: rgba(255,255,255,0.07); color: var(--tekst); padding: 0 16px; font-size: 17px; outline: none; text-align: center; }
  .laag input:focus { border-color: var(--accent); }
  .grote { width: 100%; height: 50px; margin-top: 12px; border-radius: 25px; background: var(--accent); color: #0e0e11; font-weight: 800; font-size: 16px; }
  .eind { text-align: center; padding: 80px 20px; }
  .eind h2 { font-size: 22px; color: var(--tekst); text-transform: none; letter-spacing: 0; }
  .ik { color: var(--zacht); font-size: 13px; text-align: right; }
  .ik button { background: none; color: var(--accent); padding: 0; font-size: 13px; }
  footer { color: var(--flauw); font-size: 12px; text-align: center; margin-top: 34px; }
</style>
</head>

      w_stond_al: 'Already on the wishlist', w_hebben_we_al: 'We have that one — search for “{t}”',
      w_onbekend: 'Not found — try spelling it differently', w_genoeg: 'Your wishes for this party are used up',
      w_vol: 'The wishlist is full', w_genoeg_voor_vandaag: 'The wishlist is full for today',
      w_te_kort: 'Type a bit more', w_geen_link: 'Type the song name, not a link', w_uit: 'Wishes are not available',
      w_mislukt_eerder: 'That one failed before', korter: 'Pick a nickname of at least two characters',
    }
  };
  var taal = String((navigator.languages && navigator.languages[0]) || navigator.language || 'nl').toLowerCase();
  var L = (taal.indexOf('nl') === 0 || taal.indexOf('fy') === 0) ? T.nl : T.en;
  document.documentElement.lang = L === T.nl ? 'nl' : 'en';
  function t(k, v) {
    var s = L[k] || T.nl[k] || k;
    if (v) Object.keys(v).forEach(function (n) { s = s.split('{' + n + '}').join(v[n]); });
    return s;
  }

  // ── Waar zijn we ──
  var token = decodeURIComponent(location.pathname.replace(/\/+$/, '').split('/').pop() || '');
  var basis = '/feest/' + encodeURIComponent(token);
  var opslagSleutel = 'jltamp-feest-' + token;
  var gast = null;
  try { gast = localStorage.getItem(opslagSleutel); } catch (e) { /* privé-venster */ }

  var $ = function (id) { return document.getElementById(id); };
  var stand = null, klaar = false;

  // ── Kleine DOM-hulpjes (alles via textContent) ──
  function el(tag, cls, tekst) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (tekst != null) e.textContent = tekst;
    return e;
  }
  function hoes(url, cls) {
    var h = el('div', 'hoes' + (cls ? ' ' + cls : ''));
    if (url) {
      var img = el('img', 'hoes' + (cls ? ' ' + cls : ''));
      img.alt = ''; img.loading = 'lazy'; img.src = url;
      img.onerror = function () { img.replaceWith(h); };
      return img;
    }
    return h;
  }
  var SVG_DUIM = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 21h3V9H2v12zm20-11a2 2 0 0 0-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.1L13.2 1 6.6 7.6C6.2 7.9 6 8.4 6 9v10a2 2 0 0 0 2 2h9c.8 0 1.5-.5 1.8-1.2l3-7.1c.1-.2.2-.5.2-.7v-2z"/></svg>';
  var SVG_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

  var meldTimer = null;
  function meld(tekst) {
    var m = $('melding');
    m.textContent = tekst;
    m.classList.add('zicht');
    clearTimeout(meldTimer);
    meldTimer = setTimeout(function () { m.classList.remove('zicht'); }, 2600);
  }

  // ── Praten met de server ──
  function vraag(pad, opties) {
    opties = opties || {};
    var headers = { 'Accept': 'application/json' };
    if (gast) headers['X-Feest-Gast'] = gast;
    if (opties.body) headers['Content-Type'] = 'application/json';
    return fetch(basis + pad, {
      method: opties.method || 'GET', headers: headers,
      body: opties.body ? JSON.stringify(opties.body) : undefined,
      cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer',
    }).then(function (r) {
      if (r.status === 404 || r.status === 410) {
        // Een onbekende aanvraag is geen dood feest; alleen de stand beslist dat.
        if (pad === '/stand' || pad === '/gast') { einde(r.status); throw new Error('einde'); }
      }
      if (r.status === 401) { gast = null; vraagNaam(); throw new Error('naam'); }
      if (r.status === 429) { meld(t('rustig')); throw new Error('429'); }
      if (!r.ok) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          meld((d && d.detail) || t('fout')); throw new Error('fout');
        });
      }
      return r.json();
    });
  }

  function einde(status) {
    klaar = true;
    $('inhoud').hidden = true;
    $('naamLaag').hidden = true;
    $('eind').hidden = false;
    $('eindKop').textContent = status === 404 ? t('bestaatNiet') : t('afgelopen');
    $('eindTekst').textContent = t('eindTekst');
    try { localStorage.removeItem(opslagSleutel); } catch (e) {}
  }

  // ── Tekenen ──
  function teken(d) {
    stand = d;
    $('inhoud').hidden = false;
    $('naam').textContent = d.naam || 'JLTamp';
    document.title = (d.naam || 'Feest') + ' · JLTamp';

    var wie = $('wie');
    wie.textContent = '';
    if (d.ik) {
      wie.appendChild(document.createTextNode(t('ikBen', { n: d.ik.bijnaam }) + ' · '));
      var w = el('button', null, t('wissel'));
      w.style.cssText = 'background:none;color:var(--accent);padding:0;font-size:13px';
      w.onclick = function () { vraagNaam(d.ik.bijnaam); };
      wie.appendChild(w);
    }

    // Nu speelt
    var nu = $('nu');
    nu.textContent = '';
    nu.appendChild(hoes(d.nu && d.nu.hoes));
    var nt = el('div', 'tekst');
    nt.appendChild(el('div', 'label', t('nu')));
    nt.appendChild(el('div', 'titel', d.nu ? d.nu.titel : t('niets')));
    if (d.nu && d.nu.artiest) nt.appendChild(el('div', 'sub', d.nu.artiest));
    nu.appendChild(nt);

    // Aanvragen, gesorteerd door de server: ingepland bovenaan, dan op stemmen.
    $('kopAanvragen').textContent = t('aanvragen') + (d.aanvragen.length ? ' · ' + d.aanvragen.length : '');
    var lijst = $('aanvragen');
    lijst.textContent = '';
    if (!d.aanvragen.length) lijst.appendChild(el('div', 'leeg', t('geenAanvragen')));
    d.aanvragen.forEach(function (a) {
      var r = el('div', 'rij');
      r.appendChild(hoes(a.hoes));
      var tx = el('div', 'tekst');
      var ti = el('div', 'titel');
      if (a.volgende) ti.appendChild(el('span', 'volgende', t('volgende')));
      ti.appendChild(document.createTextNode(a.titel));
      tx.appendChild(ti);
      tx.appendChild(el('div', 'sub', a.artiest));
      tx.appendChild(el('div', 'door', t('door', { n: a.bijnaam })));
      r.appendChild(tx);
      var knop = el('button', 'duim' + (a.gestemd ? ' aan' : ''));
      knop.innerHTML = SVG_DUIM;   // vaste tekening, geen data van buiten
      knop.appendChild(el('span', null, String(a.stemmen)));
      knop.setAttribute('aria-pressed', a.gestemd ? 'true' : 'false');
      knop.onclick = function () {
        if (!gast) { vraagNaam(); return; }
        knop.disabled = true;
        vraag('/stem/' + a.id, { method: 'POST' }).then(teken).catch(function () {}).then(function () { knop.disabled = false; });
      };
      r.appendChild(knop);
      lijst.appendChild(r);
    });

    // Wat de gastheer zelf al in de rij heeft staan.
    var daarna = $('daarna');
    daarna.textContent = '';
    $('daarnaVak').hidden = !(d.wachtrij && d.wachtrij.length);
    $('kopDaarna').textContent = t('daarna');
    (d.wachtrij || []).forEach(function (x) {
      var r = el('div', 'rij');
      r.appendChild(hoes(x.hoes));
      var tx = el('div', 'tekst');
      tx.appendChild(el('div', 'titel', x.titel));
      tx.appendChild(el('div', 'sub', x.artiest));
      r.appendChild(tx);
      daarna.appendChild(r);
    });
  }

  function ververs() {
    if (klaar) return Promise.resolve();
    return vraag('/stand').then(teken).catch(function () {});
  }

  // ── Bijnaam ──
  function vraagNaam(huidig) {
    if (klaar) return;
    $('naamLaag').hidden = false;
    var i = $('bijnaam');
    i.value = huidig || '';
    setTimeout(function () { i.focus(); }, 50);
  }
  $('naamForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var naam = $('bijnaam').value.trim();
    if (naam.length < 2) { meld(t('korter')); return; }
    var oud = gast; gast = null;
    vraag('/gast', { method: 'POST', body: { bijnaam: naam } }).then(function (d) {
      gast = d.gast;
      try { localStorage.setItem(opslagSleutel, gast); } catch (e2) {}
      $('naamLaag').hidden = true;
      teken(d);
    }).catch(function () { if (!gast) gast = oud; });
  });

  // ── Zoeken ──
  var zoekTimer = null, zoekNr = 0;
  $('zoekveld').addEventListener('input', function () {
    clearTimeout(zoekTimer);
    var q = this.value.trim();
    if (q.length < 2) { $('zoekvak').hidden = true; return; }
    zoekTimer = setTimeout(function () { zoek(q); }, 350);
  });
  function zoek(q) {
    if (!gast) { vraagNaam(); return; }
    var nr = ++zoekNr;
    vraag('/zoek?q=' + encodeURIComponent(q)).then(function (d) {
      if (nr !== zoekNr) return;
      var vak = $('resultaten');
      vak.textContent = '';
      $('zoekvak').hidden = false;
      if (!d.items.length) vak.appendChild(el('div', 'leeg', t('geenResultaat')));
      d.items.forEach(function (it) {
        var r = el('div', 'rij');
        r.appendChild(hoes(it.hoes));
        var tx = el('div', 'tekst');
        tx.appendChild(el('div', 'titel', it.titel));
        tx.appendChild(el('div', 'sub', it.artiest + (it.album ? ' · ' + it.album : '')));
        r.appendChild(tx);
        var knop = el('button', 'plus');
        knop.innerHTML = SVG_PLUS;
        knop.setAttribute('aria-label', t('aanvragen'));
        knop.onclick = function () {
          knop.disabled = true;
          vraag('/aanvraag', { method: 'POST', body: { id: it.id } }).then(function (a) {
            meld(a.status === 'gestemd' ? t('gestemd') : t('aangevraagd'));
            teken(a);
            $('zoekveld').value = '';
            $('zoekvak').hidden = true;
          }).catch(function () { knop.disabled = false; });
        };
        r.appendChild(knop);
        vak.appendChild(r);
      });
      // Niets gevonden, of niet wat je zocht? Dan mag je het wensen — als de
      // gastheer dat toestaat en je er nog over hebt.
      if (stand && stand.wensen && stand.ik && stand.ik.wensenOver > 0 && q.length >= 4) {
        var wk = el('button', 'wensknop', t('wensKnop', { q: q }) + ' (' + t('wensOver', { n: stand.ik.wensenOver }) + ')');
        wk.onclick = function () {
          wk.disabled = true;
          vraag('/wens', { method: 'POST', body: { tekst: q } }).then(function (w) {
            var x = [w.artiest, w.titel].filter(Boolean).join(' — ') || q;
            meld(t('w_' + w.status, { x: x, t: w.titel || q }));
            if (stand && stand.ik) stand.ik.wensenOver = w.wensenOver;
            if (w.status === 'aangevraagd' || w.status === 'opnieuw') wk.remove();
            else wk.disabled = false;
          }).catch(function () { wk.disabled = false; });
        };
        vak.appendChild(wk);
      }
    }).catch(function () {});
  }

  // ── Opstarten ──
  $('zoekveld').placeholder = t('zoek');
  $('welkom').textContent = t('welkom');
  $('welkomTekst').textContent = t('welkomTekst');
  $('bijnaam').placeholder = t('naamPlaceholder');
  $('naamKnop').textContent = t('doeMee');
  $('voet').textContent = t('voet');

  ververs().then(function () {
    if (!klaar && (!stand || !stand.ik)) { gast = null; vraagNaam(); }
  });
  // Elke vijf tellen de stand; niet als de pagina op de achtergrond staat.
  setInterval(function () { if (!document.hidden) ververs(); }, 5000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) ververs(); });
})();
</script>
</body>
</html>
