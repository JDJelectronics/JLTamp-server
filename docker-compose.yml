services:
  jltamp-server:
    build: .
    container_name: jltamp-server
    restart: unless-stopped
    ports:
      # host:container — 32400 mirrors Plex's default so nothing else changes.
      - "32400:32400"
    environment:
      SERVER_NAME: "JLTamp"
      RESCAN_INTERVAL_MIN: "0"
      # First run: open http://localhost:32400 and CREATE YOUR ADMIN ACCOUNT in
      # the browser — no password is baked in here. Optionally set a fallback/
      # backup admin password instead of (or as well as) the web wizard:
      # JLTAMP_PASSWORD: "a-strong-backup-password"
      # JLTAMP_ADMIN_EMAIL: "you@example.com"
      #
      # Optional credentials for the playlist importer. Leave unset to keep that
      # import path switched off.
      # IMPORT_CLIENT_ID: ""
      # IMPORT_CLIENT_SECRET: ""
    volumes:
      # ── EDIT THIS: point the left side at your music folder on the server ──
      - /path/to/your/music:/music:ro
      # Persistent server data (SQLite DB + artwork cache). Survives rebuilds.
      - jltamp-data:/data

volumes:
  jltamp-data:
